name: CLA 📝

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  cla:
    uses: omnidotdev/.github/.github/workflows/cla.yml@master
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    secrets:
      CLA_APP_CLIENT_ID: ${{ secrets.CLA_APP_CLIENT_ID }}
      CLA_APP_PRIVATE_KEY: ${{ secrets.CLA_APP_PRIVATE_KEY }}
